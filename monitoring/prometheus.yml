global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: sangam-mw

rule_files:
  - "rules.yml"

scrape_configs:
  - job_name: sangam-mw
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
