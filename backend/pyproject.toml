[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sangam-mw"
version = "0.1.0"
description = "Open-source middleware / iPaaS platform"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Sangam AI", email = "engineering@sangam.ai"}
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "cryptography>=42.0.0",
    "python-jose[cryptography]>=3.3.0",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    "jsonschema>=4.22.0",
    "pandas>=2.2.0",
    "pyarrow>=14.0.0",
    "openpyxl>=3.1.0",
    "duckdb>=0.10.0",
    "apscheduler>=3.10,<4",
    "croniter>=2.0.0",
    "typer[all]>=0.12.0",
    "structlog>=24.0.0",
    "importlib-metadata>=7.0.0",
    "restrictedpython>=7.0.0",
    "boto3>=1.34.0",
    "psycopg2-binary>=2.9.9",
    "PyJWT[crypto]>=2.8.0",
    "pyyaml>=6.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.4.0"]
redis = ["redis>=5.0.0"]
mongodb = ["pymongo>=4.6.0"]
bigquery = ["google-cloud-bigquery>=3.20.0", "google-auth>=2.29.0", "pyarrow>=14.0.0"]
snowflake = ["snowflake-connector-python>=3.9.0"]
slack = ["slack-sdk>=3.27.0"]
openai = ["openai>=1.30.0"]
anthropic-connector = ["anthropic>=0.28.0"]
http-sidecar = ["httpx>=0.27.0"]
all-connectors = [
    "confluent-kafka>=2.4.0",
    "redis>=5.0.0",
    "pymongo>=4.6.0",
    "google-cloud-bigquery>=3.20.0",
    "google-auth>=2.29.0",
    "snowflake-connector-python>=3.9.0",
    "slack-sdk>=3.27.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pandas-stubs>=2.0.0",
    "types-python-jose>=3.3.0",
    "httpx>=0.27.0",
    "anyio[trio]>=4.0.0",
]

[project.entry-points."sangam_mw.connectors"]
file = "sangam_mw.connectors.file.connector:FileConnector"
salesforce = "sangam_mw.connectors.salesforce.connector:SalesforceConnector"
aws-s3 = "sangam_mw.connectors.aws_s3.connector:S3Connector"
postgres = "sangam_mw.connectors.postgres.connector:PostgresConnector"
rest-api = "sangam_mw.connectors.rest_api.connector:RestApiConnector"
kafka = "sangam_mw.connectors.kafka.connector:KafkaConnector"
redis = "sangam_mw.connectors.redis.connector:RedisConnector"
mongodb = "sangam_mw.connectors.mongodb.connector:MongoDBConnector"
bigquery = "sangam_mw.connectors.bigquery.connector:BigQueryConnector"
snowflake = "sangam_mw.connectors.snowflake.connector:SnowflakeConnector"
slack = "sangam_mw.connectors.slack.connector:SlackConnector"
openai = "sangam_mw.connectors.openai.connector:OpenAIConnector"
anthropic = "sangam_mw.connectors.anthropic.connector:AnthropicConnector"
http-sidecar = "sangam_mw.connectors.http_sidecar.connector:HttpSidecarConnector"

[project.scripts]
sangam = "sangam_mw.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["sangam_mw"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "B904", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = ["duckdb", "apscheduler.*", "restrictedpython.*", "authlib.*", "jsonschema", "boto3", "botocore"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:apscheduler",
    "ignore::DeprecationWarning:pkg_resources",
]
